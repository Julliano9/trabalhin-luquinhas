<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prateleira</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>ViuOrganizou</h1>
      <p>Seu estoque organizado, item por item</p>
    </header>

    <main>
      <section class="cartao">
        <h2>Novo produto</h2>
        <form id="form-produto">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Caderno" required />

          <label for="preco">Preço (R$)</label>
          <input type="number" id="preco" name="preco" step="0.01" min="0" placeholder="Ex: 12.50" required />

          <label for="quantidade">Quantidade</label>
          <input type="number" id="quantidade" name="quantidade" min="0" placeholder="Ex: 10" required />

          <p id="mensagem-erro" class="mensagem-erro" role="alert" hidden></p>

          <button type="submit" id="botao-form">Adicionar produto</button>
          <button type="button" id="botao-cancelar" class="botao-cancelar" hidden>Cancelar edição</button>
        </form>
      </section>

      <section class="cartao">
        <h2>Produtos cadastrados</h2>
        <p id="contador" class="contador">Produtos cadastrados: 0</p>
        <p id="mensagem-vazia" class="mensagem-vazia">Nenhum produto cadastrado.</p>
        <ul id="lista-produtos"></ul>
      </section>
    </main>

    <footer>
      <p>ViuOrganizou &copy; 2026 — Projeto da disciplina de Fundamentos Web, feito com HTML, CSS e JavaScript puro.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
